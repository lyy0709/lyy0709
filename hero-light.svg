<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 248" width="840" height="248" role="img" aria-label="lyy0709 GitHub Profile Hero">
  <style>
    @keyframes pulseRing {
      0% { r: 3.5; opacity: 0.75; }
      70% { r: 10; opacity: 0; }
      100% { r: 10; opacity: 0; }
    }
    @keyframes scanSweep {
      0% { transform: translateX(-90px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateX(250px); opacity: 0; }
    }
    .ping { animation: pulseRing 2.6s cubic-bezier(0.2, 0.7, 0.3, 1) infinite; }
    .scan { animation: scanSweep 4.8s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .ping, .scan { animation: none; opacity: 0.4; }
    }
  </style>
  <defs>
    
    <linearGradient id="hero-light-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="hero-light-accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="28%" stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="72%" stop-color="#059669" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
  
    <pattern id="hero-light-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.55"/>
    </pattern>
    <linearGradient id="hero-light-dot-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="42%" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.95"/>
    </linearGradient>
    <mask id="hero-light-dot-mask">
      <rect width="840" height="248" fill="url(#hero-light-dot-fade)"/>
    </mask>
    <radialGradient id="hero-light-glow-a" cx="78%" cy="16%" r="48%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-light-glow-b" cx="92%" cy="88%" r="42%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hero-light-clip">
      <rect x="0.5" y="0.5" width="839" height="247" rx="16"/>
    </clipPath>
    <clipPath id="hero-light-scan-clip">
      <rect x="544" y="198" width="248" height="3" rx="1.5"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hero-light-clip)">
    <rect width="840" height="248" fill="url(#hero-light-bg)"/>
    <rect width="840" height="248" fill="url(#hero-light-dots)" mask="url(#hero-light-dot-mask)"/>
    <rect width="840" height="248" fill="url(#hero-light-glow-a)"/>
    <rect width="840" height="248" fill="url(#hero-light-glow-b)"/>
    <rect x="0" y="0" width="840" height="2" fill="url(#hero-light-accent-line)"/>
