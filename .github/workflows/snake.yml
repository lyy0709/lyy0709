name: Update GitHub Profile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml
      - .github/scripts/**
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check contribution token
        env:
          SNAKE_GITHUB_TOKEN: ${{ secrets.SNAKE_GITHUB_TOKEN }}
        run: |
          if [ -z "$SNAKE_GITHUB_TOKEN" ]; then
            echo "::error::Set SNAKE_GITHUB_TOKEN to a personal token that can read private contribution totals."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate profile visuals and contribution snake
        env:
          SNAKE_GITHUB_TOKEN: ${{ secrets.SNAKE_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node .github/scripts/build-profile.mjs --output-dir dist

      - name: Publish assets to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
