name: Generate Snake

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check contribution token
        env:
          SNAKE_GITHUB_TOKEN: ${{ secrets.SNAKE_GITHUB_TOKEN }}
        run: |
          if [ -z "$SNAKE_GITHUB_TOKEN" ]; then
            echo "::error::Set SNAKE_GITHUB_TOKEN to a personal token that can read private contribution totals."
            exit 1
          fi

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.SNAKE_GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?color_snake=%230969da
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2358a6ff

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
