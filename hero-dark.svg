<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 248" width="840" height="248" role="img" aria-label="lyy0709 GitHub Profile Hero">
  <style>
    @keyframes pulseRing {
      0% { r: 3.5; opacity: 0.75; }
      70% { r: 10; opacity: 0; }
      100% { r: 10; opacity: 0; }
    }
    @keyframes scanSweep {
      0% { transform: translateX(-90px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateX(250px); opacity: 0; }
    }
    .ping { animation: pulseRing 2.6s cubic-bezier(0.2, 0.7, 0.3, 1) infinite; }
    .scan { animation: scanSweep 4.8s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .ping, .scan { animation: none; opacity: 0.4; }
    }
  </style>
  <defs>
    
    <linearGradient id="hero-dark-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121926"/>
      <stop offset="100%" stop-color="#0d131d"/>
    </linearGradient>
    <linearGradient id="hero-dark-accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="28%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="72%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  
    <pattern id="hero-dark-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2b3b54" opacity="0.45"/>
    </pattern>
    <linearGradient id="hero-dark-dot-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="42%" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.95"/>
    </linearGradient>
    <mask id="hero-dark-dot-mask">
      <rect width="840" height="248" fill="url(#hero-dark-dot-fade)"/>
    </mask>
    <radialGradient id="hero-dark-glow-a" cx="78%" cy="16%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-dark-glow-b" cx="92%" cy="88%" r="42%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hero-dark-clip">
      <rect x="0.5" y="0.5" width="839" height="247" rx="16"/>
    </clipPath>
    <clipPath id="hero-dark-scan-clip">
      <rect x="544" y="198" width="248" height="3" rx="1.5"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hero-dark-clip)">
