    <rect width="840" height="248" fill="url(#hero-dark-glow-a)"/>
    <rect width="840" height="248" fill="url(#hero-dark-glow-b)"/>
    <rect x="0" y="0" width="840" height="2" fill="url(#hero-dark-accent-line)"/>
